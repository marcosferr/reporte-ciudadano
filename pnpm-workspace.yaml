# Parches de seguridad para dependencias transitivas que aún no los traen (pnpm audit).
overrides:
  http-cache-semantics: ^4.3.0
  source-map-js: ^1.2.2
patchedDependencies:
  astro-sst@3.1.4: patches/astro-sst@3.1.4.patch
